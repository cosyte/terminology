# Install-time hardening. `packageManager` in package.json pins pnpm 10.34.5, which knows both
# keys: minimumReleaseAge arrived in pnpm 10.16.0 and trustPolicy in 10.21.0, and an older pnpm
# ignores them, which is a settings file that decorates rather than defends.
#
# minimumReleaseAge: a package version younger than this many minutes is not installable, so a
# compromised release has to survive a day of public scrutiny before it can reach this tree.
# @cosyte is exempt by operator decision; every third-party package keeps the floor.
# trustPolicy: `no-downgrade` refuses a resolution whose trust evidence is weaker than that of an
# earlier-published version of the same package.
#
# Every exemption carries a `# reason:` comment on the line above it. A lowered floor, a weakened
# policy or a deleted key is never the remedy for a refused install.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # reason: first-party @cosyte package, exempt from the floor by operator decision
  - "@cosyte/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  # reason: measured 2026-11-07 on pnpm 10.34.5. A from-scratch resolution of this repository's
  # dependency set reds with ERR_PNPM_TRUST_DOWNGRADE on undici-types, reached as a transitive of
  # @types/node and pinned at exactly this version by the committed pnpm-lock.yaml. pnpm reports
  # "Earlier versions had provenance attestation, but this version has no trust evidence": a
  # publisher who stopped attaching provenance, on a types-only tarball with no runtime code and no
  # install scripts. hl7 carries the same exemption.
  - "undici-types@6.21.0"
  # reason: measured 2026-11-07 on pnpm 10.34.5, same shape, found by the same resolution once
  # undici-types was excluded. chokidar is a transitive of tsup, pinned at exactly this version by
  # the committed pnpm-lock.yaml; earlier releases carry a provenance attestation and 4.0.3 carries
  # none. pnpm's own documentation uses this package and version as its worked example of a
  # trustPolicyExclude entry (https://pnpm.io/settings/dependency-resolution).
  - "chokidar@4.0.3"
