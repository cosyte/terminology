name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers (`TERMINOLOGY-6`), phase and roadmap-section language
# (`roadmap §4.1`), ADR numbers, meta-repo paths and process commentary belong in the
# changeset, CHANGELOG.md, the commit, the PR and the roadmap, never in README.md,
# docs-content/, the npm description, a JSDoc block a consumer's editor renders, or a
# diagnostic message a consumer reads in their logs. The rule is written out in this
# repository's `documentation/agent-notes.md` ("No internal project bookkeeping: the
# prefix-keyed gate"); `scripts/check-no-internal-refs.sh` is what enforces it.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(roadmap §4.2)` into a module header; a job that reds does not. This
# repository had no such gate until this file landed, on a package that is ALREADY
# PUBLISHED to npm, so what regressed here would regress into a live tarball.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-internal-refs`, which is
# this repository's own checker. The job below delegates the plumbing (checkout, pnpm,
# Node) to the shared gate workflow, which carries no pattern, no allow-list and no file
# selection of its own: it prepares the tree, runs the command, and lets the command's
# exit status decide the job. The detection rules, the self-tests and the known project
# prefixes all stay here, because what counts as a project prefix and what counts as a
# domain designator is a property of this package.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`, which is the context a branch ruleset must require.
# Renaming the job detaches that requirement with no error anywhere, and a required
# context nothing emits blocks every pull request.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml:
#
#   The shared ci pipeline is not an option. `terminology`'s `ci` job calls the shared
#   cosyte/.github ci.yml, which runs a fixed ladder and no arbitrary repo script. Adding this there would also flip every other caller red on its next run:
#   the measured backlog was 149 internal references across 11 repos, and remediating each
#   is its own deliberate piece of work. A shared pipeline is the wrong place to land a rule
#   most of its callers cannot yet satisfy.
#
#   Within this repo, keeping it out of ci.yml also keeps it cheap: this job is a checkout
#   and a handful of greps over the public markdown, the npm metadata and the source files,
#   while ci.yml drives the full Node 22, 24, and 26 matrix plus the prepublish job.
#
# NO MATRIX, DELIBERATELY. The script is bash + grep + awk with a pinned `LC_ALL`; nothing
# in it moves between Node majors. The one Node dependency is reading `package.json`, and
# the script refuses rather than skipping if `node` is absent. Because there is no matrix,
# the check-run context carries no matrix suffix: it is `no-internal-refs / public-surface`,
# the caller job id below and then the shared workflow's job id. READ THE REAL NAME OFF A
# LIVE CHECK RUN BEFORE REQUIRING IT IN A RULESET, never off this file's `name:`: the
# workflow is titled "Public-surface gate", and requiring the title would silently protect
# nothing.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# THIS rule says identifiers BELONG in the commit, the PR and the changeset, so a PR-text
# half here would red on correct work. That is also why there is no `edited` trigger:
# nothing here reads PR text, so retitling a PR cannot change the result.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page. Note that
# its INPUT is the first sentence of each changeset here, which this job treats as private:
# open every changeset with a sentence that stands on its own once the identifier is gone.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Called at the published reference, by name, as every shared workflow in this
    # repository is. The name is a function of the one commit it carries, cosyte/.github
    # never moves or reuses one, and its release there is immutable, so this line delivers
    # nothing new until it is edited here. The release notes say what adopting a newer
    # reference asks of a caller: https://github.com/cosyte/.github/releases
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs.yml@workflows-2026-11-07-498c7c13c886
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
