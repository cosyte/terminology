name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:37 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ▶ THESE JOB NAMES ARE LOAD-BEARING. The repository ruleset `ci-required-checks` requires the
  # check-run contexts this caller produces, verbatim:
  #     ci / verify (22, ubuntu-latest)
  #     ci / verify (24, ubuntu-latest)
  #     ci / actionlint
  # The `ci /` prefix is the caller job id below; `verify` / `actionlint` are the job ids in the
  # shared pipeline; the matrix suffix is `node` then `os`. Rename the job below, change the Node
  # matrix, or rename a job upstream in cosyte/.github, and the required contexts stop being emitted:
  # that does not fail a PR, it leaves it PENDING and unmergeable forever. Update the ruleset in the
  # same change.
  #
  # ▶ AND: a required JOB gates all of its STEPS. `verify` runs typecheck, lint, format:check, the
  # PHI scan, tests, the gating coverage run, build, attw and the dual ESM/CJS smoke as steps inside
  # one required context. Promote any of those to its own job and it is silently NO LONGER REQUIRED,
  # with no error anywhere: the ruleset still passes because the job it names still passes. Splitting
  # a step out means adding its new context to the ruleset in the same change.
  #
  # ▶ THE TERMINOLOGY ECOSYSTEM CONFORMANCE JOB RUNS INSIDE `verify`, AS PART OF WHAT `pnpm test`
  # ALREADY RUNS (`test/conformance/tx-ecosystem.test.ts`, driven by the vendored snapshot under
  # `vendor/tx-ecosystem/`). It is deliberately NOT a job of its own, for the reason directly above:
  # a new job emits a new check-run context, the ruleset does not name it, and it would be required
  # by nobody. `pnpm run conformance:tx` is the same measurement with a printed summary, for a human
  # at a terminal; CI needs no separate step for it.
  #
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the shared default Node matrix, 22, 24, and 26: we claim only
  # the Node lines CI runs. Repo-specific extra jobs (an examples smoke, for one) are added on top of
  # this caller, never instead of it.
  #
  # Every shared workflow in this repository is called at one published reference,
  # `workflows-2026-11-07-498c7c13c886`, by name. It names one commit of cosyte/.github and never
  # another (its release there is immutable), so nothing upstream reaches this pipeline until a
  # change here moves every caller to a newer reference together. Its release notes say what a
  # caller adopting it must act on: https://github.com/cosyte/.github/releases
  # The template ships a PHI scanner (scripts/phi-scan.ts), so the shared pipeline's optional
  # PHI-scan step is switched on. NOTE: the scaffolded scanner is a STARTER, and it detects only
  # cross-cutting SSN/email shapes until you add structured, field-level detection for this
  # standard's PHI (see the STARTER banner in scripts/phi-scan.ts).
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    with:
      run-phi-scan: true

  # The runnable programs under examples/. They import the package by name, which resolves through
  # its own `exports` to `dist/`, so the build comes first. Each example checks its own output and
  # exits non-zero on a mismatch. They sit outside the PHI scanner's default roots, so they are
  # scanned here by path. Not a required context.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Examples
        run: pnpm examples
      - name: PHI scan (examples)
        run: pnpm phi-scan examples/README.md examples/*.ts

  # The house checks from @cosyte/script-utils.
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:agent-notes
      - run: pnpm check:catalog
