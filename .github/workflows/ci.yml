name: CI

on:
  push:
    # Temporary: the branch that adopts the testing standard, before its pull request opens.
    branches: [main, test/testing-standard]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:37 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ▶ THESE JOB NAMES ARE LOAD-BEARING. The repository ruleset `ci-required-checks` requires the
  # check-run contexts this caller produces, verbatim:
  #     ci / verify (22, ubuntu-latest)
  #     ci / verify (24, ubuntu-latest)
  #     ci / actionlint
  # The `ci /` prefix is the caller job id below; `verify` / `actionlint` are the job ids in the
  # shared pipeline; the matrix suffix is `node` then `os`. Rename the job below, change the Node
  # matrix, or rename a job upstream in cosyte/.github, and the required contexts stop being emitted:
  # that does not fail a PR, it leaves it PENDING and unmergeable forever. Update the ruleset in the
  # same change.
  #
  # ▶ AND: a required JOB gates all of its STEPS. `verify` runs typecheck, lint, format:check, the
  # PHI scan, tests, the gating coverage run, build, attw and the dual ESM/CJS smoke as steps inside
  # one required context. Promote any of those to its own job and it is silently NO LONGER REQUIRED,
  # with no error anywhere: the ruleset still passes because the job it names still passes. Splitting
  # a step out means adding its new context to the ruleset in the same change.
  #
  # ▶ THE TERMINOLOGY ECOSYSTEM CONFORMANCE JOB RUNS INSIDE `verify`, AS PART OF WHAT `pnpm test`
  # ALREADY RUNS (`test/conformance/tx-ecosystem.test.ts`, driven by the vendored snapshot under
  # `vendor/tx-ecosystem/`). It is deliberately NOT a job of its own, for the reason directly above:
  # a new job emits a new check-run context, the ruleset does not name it, and it would be required
  # by nobody. `pnpm run conformance:tx` is the same measurement with a printed summary, for a human
  # at a terminal; CI needs no separate step for it.
  #
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the shared default Node matrix, 22, 24, and 26: we claim only
  # the Node lines CI runs. Repo-specific extra jobs (an examples smoke, for one) are added on top of
  # this caller, never instead of it.
  #
  # Every shared workflow in this repository is called at a published reference, by name: the
  # callers in the other workflow files at `workflows-2026-11-08-c0db8d8e5927`, the weekly mutation
  # and nightly property callers and this one at `workflows-2026-11-10-398cd4ded647` (see below). A
  # reference names one commit of cosyte/.github and never another (its release there is
  # immutable), so nothing upstream reaches this pipeline until a change here moves a caller to a
  # newer one. Its release notes say what a caller adopting it must act on:
  # https://github.com/cosyte/.github/releases
  # The shared pipeline's optional PHI-scan step is switched on. `pnpm phi-scan` runs
  # `cosyte-phi-scan` from @cosyte/script-utils (ST34): the cross-cutting SSN and email floor over
  # the whole repository, with scripts/phi-allow-list.txt and scripts/phi-scan.exclude.
  #
  # `verify` runs on every system: Linux, Windows and macOS, each on Node 22, 24 and 26. The
  # Ubuntu legs keep the names the ruleset requires; the Windows and macOS legs are new contexts,
  # `ci / verify (<node>, windows-latest)` and `ci / verify (<node>, macos-latest)`. The suite also
  # runs under Bun and under Deno, each in its own job (`bun`, `deno`), on Linux.
  #
  # The testing and performance standards' jobs run beside `verify`, never after it, so a pull
  # request waits for the slowest job rather than their sum:
  # - `coverage-ratchet`: coverage held to quality-floor.json, and on a pull request every changed
  #   line that coverage counts must have run and no floor may be lowered or removed;
  # - `mutation` (pull requests only): the changed source files mutated with stryker.config.mjs,
  #   and every mutant in the changed lines killed;
  # - `scaling-gate`: `pnpm test:perf`, the scaling gates for the loaders and for expansion and
  #   their self-checks, never under coverage;
  # - `bench-compare` (pull requests only): bench/terminology.bench.mjs timed on the base build and
  #   the head build, interleaved on one runner. Advisory: it never fails, so never require it.
  # A skipped job satisfies a required check, so require each of the others only while its input
  # below stays on. The full reading, the budgets and the profile are in bench-reading.yml; the
  # full mutation run is weekly-mutation.yml, and the deep property run nightly-properties.yml.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      run-phi-scan: true
      run-bun: true
      run-deno: true
      run-coverage-ratchet: true
      run-mutation: true
      run-scaling-gate: true
      run-bench-compare: true

  # The runnable programs under examples/. They import the package by name, which resolves through
  # its own `exports` to `dist/`, so the build comes first. Each example checks its own output and
  # exits non-zero on a mismatch. The PHI step below also names them by path, so
  # examples/README.md, which the sweep skips as Markdown, is read too. Not a required context.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Examples
        run: pnpm examples
      - name: PHI scan (examples)
        run: pnpm phi-scan examples/README.md examples/*.ts

  # The house checks from @cosyte/script-utils, and `cosyte-process check` from @cosyte/process: the
  # five verb scripts and four variants delegate exactly, cosyte-process.config.json is valid, and
  # the direct `vitest` is exactly the version process runs. `pnpm test` also runs that check
  # (test/scripts/process-wiring.test.ts), which is what puts it inside the required `ci / verify`.
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
      - run: pnpm check:process
